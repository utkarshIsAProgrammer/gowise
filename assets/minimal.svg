<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Electric Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Electric Amber/Green Spark -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Subtle Inner Grid / Matrix Lines -->
  <path d="M 60 160 L 452 160 M 60 256 L 452 256 M 60 352 L 452 352" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,8" opacity="0.4"/>
  <path d="M 160 60 L 160 452 M 256 60 L 256 452 M 352 60 L 352 452" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,8" opacity="0.4"/>

  <!-- Outer Cyber G Symbol & Prompt -->
  <!-- Top bar of G -->
  <path d="M 360 140 L 210 140 C 150 140 110 180 110 256 C 110 332 150 372 210 372 L 340 372 C 370 372 390 352 390 322 L 390 270 L 260 270" 
        fill="none" 
        stroke="url(#borderGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Electric Terminal Chevron > -->
  <path d="M 180 200 L 245 256 L 180 312" 
        fill="none" 
        stroke="url(#neonCyan)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Fluent Glowing Modeless Cursor Beam -->
  <line x1="285" y1="216" x2="285" y2="296" 
        stroke="url(#neonGreen)" 
        stroke-width="20" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Micro Accent Nodes -->
  <circle cx="360" cy="140" r="10" fill="#00E5FF"/>
  <circle cx="260" cy="270" r="8" fill="#34D399"/>
</svg>
